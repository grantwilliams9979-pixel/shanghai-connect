name: Update sitemap

# Keeps sitemap.xml in sync with the pages that exist in the repo, so adding a
# new <route>/index.html is all it takes for the page to appear in the sitemap.
on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so <lastmod> can use each page's last commit date.
          fetch-depth: 0

      - name: Regenerate sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap.xml [skip ci]"
          git push
